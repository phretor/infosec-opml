[project]
name = "infosec-opml"
version = "0.1.0"
description = "Curated collection of infosec RSS/Atom feeds in OPML format"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "ty==0.0.85",
]

[project.scripts]
feeds-check = "scripts.check_feeds:main"
feeds-add = "scripts.add_feeds:main"
feeds-stats = "scripts.stats:main"
feeds-cache = "scripts.fetch_cache:main"
feeds-miniflux-sync = "scripts.miniflux_sync:main"
feeds-lint-opml = "scripts.lint_opml:main"
feeds-check-readme = "scripts.check_readme:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ty]
