name: PR linting

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pr-linting.yml"

concurrency:
  group: pr-linting-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: ruff + ty (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # checkout only
    steps:
      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install project
        run: uv sync --extra dev
      - name: Run ruff check
        run: uv run ruff check scripts tests
      - name: Run ruff format --check
        run: uv run ruff format --check scripts tests
      - name: Run ty check
        run: uv run ty check scripts tests
